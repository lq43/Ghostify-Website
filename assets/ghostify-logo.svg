      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon container -->
  <rect x="2" y="2" width="36" height="36" rx="10" fill="#08140D" stroke="#00FF66" stroke-width="1.5" stroke-opacity="0.5" />
  
  <!-- Ghost Pin Shape -->
